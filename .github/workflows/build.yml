name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:  # permite rodar manualmente pelo botão no GitHub

jobs:
  build:
    runs-on: macos-15  # Xcode 16 + iOS SDK 18 (retrocompat com iOS 17)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Install CMake
        run: brew install cmake

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=cmake/ios_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SKIP_BUILD_RPATH=ON \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON

      - name: Build dylib
        run: cmake --build build --config Release


      # ── Monta o .app manualmente ─────────────────────────────────────────────
      # CMake com MACOSX_BUNDLE gera FFCheat em build/FFCheat.app/Contents/MacOS/FFCheat
      # (estrutura macOS). Para iOS o IPA precisa de Payload/FFCheat.app/FFCheat flat.
      # Localizamos o executável onde o CMake o colocou e copiamos para a estrutura iOS.
      - name: Create .app bundle
        run: |
          APP_DIR=build/Payload/FFCheat.app
          mkdir -p "$APP_DIR"

          # Localiza o executável gerado pelo CMake (bundle macOS-style ou flat)
          EXE=""
          if [ -f "build/FFCheat.app/Contents/MacOS/FFCheat" ]; then
            EXE="build/FFCheat.app/Contents/MacOS/FFCheat"
          elif [ -f "build/FFCheat" ]; then
            EXE="build/FFCheat"
          else
            # Fallback: busca recursivo
            EXE=$(find build -name "FFCheat" -type f | grep -v '\.app/Payload' | head -1)
          fi

          if [ -z "$EXE" ]; then
            echo "ERRO: executável FFCheat não encontrado em build/"
            find build -type f -name "FFCheat*" || true
            exit 1
          fi

          echo "Executável encontrado: $EXE"
          cp "$EXE" "$APP_DIR/FFCheat"
          chmod +x "$APP_DIR/FFCheat"

          # Copia a dylib payload para dentro do bundle
          cp build/MetalCaptureSupport.dylib "$APP_DIR/MetalCaptureSupport.dylib"

          # Copia o Info.plist
          cp InjectorApp/Info.plist "$APP_DIR/Info.plist"

          # Copia os ícones Nubank para o bundle
          ICON_DIR="InjectorApp/Assets.xcassets/AppIcon.appiconset"
          if [ -d "$ICON_DIR" ]; then
            cp "$ICON_DIR"/Icon-*.png "$APP_DIR/"
          fi

          echo "Conteúdo do bundle:"
          ls -lh "$APP_DIR/"

      - name: Fix rpaths (remove build-dir rpath, mantém @executable_path)
        run: |
          APP_DIR=build/Payload/FFCheat.app
          EXE="$APP_DIR/FFCheat"

          echo "LC_RPATH antes do fix:"
          otool -l "$EXE" | grep -A2 LC_RPATH || true

          # Remove qualquer rpath que aponte para caminho absoluto de build
          # (CMake injeta o build dir por padrão; no iPhone esse path não existe)
          while IFS= read -r rpath; do
            case "$rpath" in
              @*) echo "  manter: $rpath" ;;
              *)  echo "  remover: $rpath"
                  install_name_tool -delete_rpath "$rpath" "$EXE" 2>/dev/null || true ;;
            esac
          done < <(otool -l "$EXE" | grep -A2 LC_RPATH | grep 'path ' | awk '{print $2}')

          # Garante que @executable_path está presente
          otool -l "$EXE" | grep -q "@executable_path" || \
            install_name_tool -add_rpath @executable_path "$EXE"

          echo "LC_RPATH após o fix:"
          otool -l "$EXE" | grep -A2 LC_RPATH || true

          # Mesma limpeza na dylib
          DYLIB="$APP_DIR/MetalCaptureSupport.dylib"
          while IFS= read -r rpath; do
            case "$rpath" in
              @*) ;;
              *)  install_name_tool -delete_rpath "$rpath" "$DYLIB" 2>/dev/null || true ;;
            esac
          done < <(otool -l "$DYLIB" | grep -A2 LC_RPATH | grep 'path ' | awk '{print $2}')

      - name: Sign (ad-hoc, sem Apple ID)
        run: |
          APP_DIR=build/Payload/FFCheat.app

          # Assina o executável primeiro (deve vir antes do bundle)
          codesign --force --sign - \
            --entitlements entitlements.plist \
            "$APP_DIR/FFCheat"

          # Assina a dylib
          codesign --force --sign - \
            --entitlements entitlements.plist \
            "$APP_DIR/MetalCaptureSupport.dylib"

          # Assina o bundle por último
          codesign --force --sign - \
            --entitlements entitlements.plist \
            "$APP_DIR"

      - name: Package IPA
        run: |
          cd build
          # Estrutura IPA = zip com Payload/AppName.app dentro
          zip -r ../FFCheat.ipa Payload/
          cd ..
          echo "IPA criado: FFCheat.ipa"
          ls -lh FFCheat.ipa

      - name: Upload IPA como artifact
        uses: actions/upload-artifact@v4
        with:
          name: FFCheat-IPA
          path: FFCheat.ipa
          retention-days: 7  # fica disponível por 7 dias para download

